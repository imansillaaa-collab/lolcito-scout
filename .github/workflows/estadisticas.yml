# Escanea partidas rankeds de LAS con TU API key (guardada como secreto del repo), calcula las estadísticas
# y las publica en la rama "datos". La app de cada usuario las descarga de ahí.
#
# Cada corrida trabaja unas 5 horas seguidas, en tandas de ~35 minutos, y publica al terminar cada tanda.
# Así no importa si GitHub arranca tarde o se saltea alguna de las programadas: mientras una corre, la
# siguiente queda en espera y arranca apenas termina.
#
# Después de CADA tanda se guardan las partidas acumuladas (caché): si la corrida se corta a la mitad, la
# próxima sigue desde la última tanda terminada y no desde el principio. Cada tanda es un paso aparte porque
# el caché solo se puede guardar entre pasos (herramientas/tanda.sh hace el trabajo de cada una).
name: Estadísticas

on:
  schedule:
    - cron: "17 */2 * * *"    # a los :17 (en punto GitHub las atrasa o se las saltea)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: estadisticas
  cancel-in-progress: false   # la que llega mientras otra corre queda en espera

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 340      # el máximo de GitHub son 6 horas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Recuperar las partidas acumuladas
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stats-db-${{ github.run_id }}
          restore-keys: stats-db-

      - name: Hora de cierre (unas 5 horas)
        run: echo "FIN=$(( $(date +%s) + 290 * 60 ))" >> "$GITHUB_ENV"

      - name: Tanda 1
        id: t1
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DESTINO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash herramientas/tanda.sh 1
      - name: Guardar partidas (tanda 1)
        if: always() && steps.t1.outputs.guardar == 'si'
        uses: actions/cache/save@v4
        with:
          path: data
          key: stats-db-${{ github.run_id }}-1

      - name: Tanda 2
        id: t2
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DESTINO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
