# Cada 2 horas escanea partidas rankeds de LAS con TU API key (guardada como secreto del repo),
# calcula las estadísticas y las publica en la rama "datos". La app de cada usuario las descarga de ahí.
name: Estadísticas

on:
  schedule:
    - cron: "0 */2 * * *"     # cada 2 horas (GitHub a veces las atrasa; si se pisan, la segunda espera)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: estadisticas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Recuperar las partidas acumuladas
        uses: actions/cache/restore@v4
        with:
          path: data
          key: stats-db-${{ github.run_id }}
          restore-keys: stats-db-

      - name: Escanear partidas y calcular estadísticas
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python publicar.py

      - name: Guardar las partidas acumuladas
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: stats-db-${{ github.run_id }}

      - name: Publicar en la rama "datos"
        run: |
          cd publicado
          git init -q -b datos
          git config user.name "lolcito-bot"
          git config user.email "lolcito-bot@users.noreply.github.com"
          git add .
          git commit -qm "Estadísticas $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
